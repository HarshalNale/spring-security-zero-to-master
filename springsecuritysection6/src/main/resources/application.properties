spring.application.name=${SPRING_APPLICATION_NAME: springsecuritysection6}

spring.profiles.active= prod
#  we can override above profile = default property value from environment variable as well

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:bank}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.sql.init.mode=ALWAYS

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:DEBUG}